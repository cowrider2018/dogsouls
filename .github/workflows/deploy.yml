name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 動物、戰鬥、路線、劇本、音效、錄影帶、地形：哪一支沒過就不部署
      - run: npm run verify

      - run: npm ci

      # 需要在 repo 的 Settings → Secrets 加一個 CLOUDFLARE_API_TOKEN
      # （Cloudflare dashboard → My Profile → API Tokens → 用 "Edit Cloudflare Workers" 範本）
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
